<h2 class="cart-title">Carrito de Compras</h2>

<ul *ngIf="cart.length > 0; else empty" class="cart-list">
  <li *ngFor="let item of cart; index as i" class="cart-item">
    <img [src]="item.imagen" [alt]="item.nombre" class="cart-img" />
    <div class="cart-details">
      <h3 class="cart-name">{{ item.nombre }}</h3>
      <p class="cart-price">${{ item.precio }}</p>
    </div>
    <button (click)="remove(i)" class="remove-btn">Eliminar</button>
  </li>
</ul>

<ng-template #empty>
  <p class="cart-empty">El carrito está vacío.</p>
</ng-template>

<div *ngIf="cart.length > 0" class="cart-total">
  <p><strong>Total:</strong> ${{ total }}</p>
  <button (click)="clear()" class="clear-btn">Vaciar carrito</button>
</div>
